<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Learn pure HTML interactively — hands-on lessons with live preview and CodePen practice.">
  <title>Learn Pure HTML — Interactive Course</title>
  <style>
    /* ===== RESET & BASE ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap');

    :root {
      --bg-deep: #0a0a0f;
      --bg-surface: #12121a;
      --bg-card: rgba(255,255,255,0.04);
      --bg-glass: rgba(255,255,255,0.06);
      --border: rgba(255,255,255,0.08);
      --border-active: rgba(139,92,246,0.5);
      --text-primary: #f0f0f5;
      --text-secondary: #8b8b9e;
      --text-muted: #55556a;
      --accent: #8b5cf6;
      --accent-glow: rgba(139,92,246,0.25);
      --accent2: #06b6d4;
      --accent3: #f59e0b;
      --accent4: #10b981;
      --success: #22c55e;
      --danger: #ef4444;
      --radius: 16px;
      --radius-sm: 10px;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-deep);
      color: var(--text-primary);
      line-height: 1.7;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ===== BACKGROUND EFFECTS ===== */
    body::before {
      content: '';
      position: fixed;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: radial-gradient(ellipse at 20% 50%, rgba(139,92,246,0.08) 0%, transparent 50%),
                  radial-gradient(ellipse at 80% 20%, rgba(6,182,212,0.06) 0%, transparent 50%),
                  radial-gradient(ellipse at 50% 80%, rgba(245,158,11,0.04) 0%, transparent 50%);
      animation: bgShift 20s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes bgShift {
      0% { transform: translate(0, 0) rotate(0deg); }
      100% { transform: translate(-3%, -3%) rotate(3deg); }
    }

    /* ===== HEADER ===== */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10,10,15,0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
    }

    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: -0.5px;
    }

    .logo-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 1rem;
      font-weight: 700;
      color: white;
    }

    .progress-bar-container {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .progress-track {
      width: 180px;
      height: 6px;
      background: var(--bg-card);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 999px;
      width: 0%;
      transition: width 0.6s ease;
    }

    /* ===== LAYOUT ===== */
    .app-layout {
      position: relative;
      z-index: 1;
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 0;
      min-height: calc(100vh - 64px);
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      border-right: 1px solid var(--border);
      padding: 1.5rem 0;
      position: sticky;
      top: 64px;
      height: calc(100vh - 64px);
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .sidebar-title {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      padding: 0 1.5rem;
      margin-bottom: 0.75rem;
    }

    .lesson-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .lesson-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 1.5rem;
      cursor: pointer;
      transition: var(--transition);
      font-size: 0.88rem;
      color: var(--text-secondary);
      border-left: 3px solid transparent;
      position: relative;
    }

    .lesson-item:hover {
      background: var(--bg-glass);
      color: var(--text-primary);
    }

    .lesson-item.active {
      background: rgba(139,92,246,0.08);
      color: var(--text-primary);
      border-left-color: var(--accent);
      font-weight: 600;
    }

    .lesson-item.completed .lesson-num {
      background: var(--success);
      color: white;
    }

    .lesson-num {
      width: 26px; height: 26px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-size: 0.72rem;
      font-weight: 700;
      background: var(--bg-card);
      border: 1px solid var(--border);
      flex-shrink: 0;
      transition: var(--transition);
    }

    .lesson-item.active .lesson-num {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    /* ===== MAIN CONTENT ===== */
    .main-content {
      padding: 2.5rem 3rem;
      overflow-y: auto;
    }

    .lesson-header {
      margin-bottom: 2rem;
    }

    .lesson-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent);
      background: rgba(139,92,246,0.1);
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 0.75rem;
    }

    .lesson-title {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1.2;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--text-primary), var(--text-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .lesson-desc {
      font-size: 1.05rem;
      color: var(--text-secondary);
      max-width: 640px;
    }

    /* ===== CONTENT SECTIONS ===== */
    .content-section {
      margin-bottom: 2.5rem;
    }

    .section-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title .icon {
      font-size: 1.1rem;
    }

    .theory-text {
      color: var(--text-secondary);
      font-size: 0.95rem;
      max-width: 700px;
      margin-bottom: 1rem;
    }

    .theory-text strong { color: var(--text-primary); font-weight: 600; }
    .theory-text code {
      background: rgba(139,92,246,0.15);
      color: var(--accent);
      padding: 2px 7px;
      border-radius: 5px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85em;
    }

    /* ===== TAG REFERENCE CARDS ===== */
    .tag-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
      margin-top: 1rem;
    }

    .tag-card {
      background: var(--bg-glass);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      transition: var(--transition);
    }

    .tag-card:hover {
      border-color: var(--border-active);
      background: rgba(139,92,246,0.06);
      transform: translateY(-2px);
    }

    .tag-card-name {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent2);
      margin-bottom: 4px;
    }

    .tag-card-desc {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    /* ===== CODE EDITOR ===== */
    .code-playground {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-top: 1rem;
    }

    .playground-tabs {
      display: flex;
      background: rgba(0,0,0,0.3);
      border-bottom: 1px solid var(--border);
    }

    .playground-tab {
      padding: 10px 20px;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--transition);
      border-bottom: 2px solid transparent;
    }

    .playground-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .playground-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 260px;
    }

    .code-editor-area {
      border-right: 1px solid var(--border);
      position: relative;
    }

    .code-editor-area textarea {
      width: 100%;
      height: 100%;
      min-height: 260px;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      line-height: 1.7;
      padding: 1rem 1.25rem;
      resize: none;
      outline: none;
      tab-size: 2;
    }

    .code-editor-area textarea::placeholder {
      color: var(--text-muted);
    }

    .preview-pane {
      background: #fff;
      position: relative;
    }

    .preview-label {
      position: absolute;
      top: 8px; right: 12px;
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #999;
      z-index: 2;
    }

    .preview-pane iframe {
      width: 100%;
      height: 100%;
      min-height: 260px;
      border: none;
    }

    /* ===== CHALLENGE BOX ===== */
    .challenge-box {
      background: linear-gradient(135deg, rgba(245,158,11,0.08), rgba(245,158,11,0.02));
      border: 1px solid rgba(245,158,11,0.2);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-top: 1.5rem;
    }

    .challenge-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent3);
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .challenge-text {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-bottom: 1rem;
    }

    .challenge-text ol, .challenge-text ul {
      margin: 0.5rem 0 0.5rem 1.25rem;
    }

    .challenge-text li {
      margin-bottom: 0.25rem;
    }

    .challenge-text code {
      background: rgba(245,158,11,0.15);
      color: var(--accent3);
      padding: 1px 6px;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.84em;
    }

    /* ===== BUTTONS ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 22px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: var(--transition);
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #7c3aed);
      color: white;
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 30px var(--accent-glow);
    }

    .btn-secondary {
      background: var(--bg-glass);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      border-color: var(--border-active);
      background: rgba(139,92,246,0.08);
    }

    .btn-codepen {
      background: linear-gradient(135deg, #1e1f26, #2c2d35);
      color: white;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .btn-codepen:hover {
      background: linear-gradient(135deg, #2c2d35, #3c3d45);
      transform: translateY(-2px);
    }

    .btn-success {
      background: linear-gradient(135deg, var(--success), #16a34a);
      color: white;
    }

    .btn-success:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(34,197,94,0.3);
    }

    /* ===== NAVIGATION FOOTER ===== */
    .lesson-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border);
    }

    /* ===== TIP BOX ===== */
    .tip-box {
      background: rgba(6,182,212,0.06);
      border: 1px solid rgba(6,182,212,0.15);
      border-radius: var(--radius-sm);
      padding: 1rem 1.25rem;
      margin: 1rem 0;
      font-size: 0.88rem;
      color: var(--text-secondary);
    }

    .tip-box strong {
      color: var(--accent2);
    }

    /* ===== QUIZ ===== */
    .quiz-container {
      margin-top: 1.5rem;
    }

    .quiz-question {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .quiz-option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--bg-glass);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition);
      font-size: 0.88rem;
    }

    .quiz-option:hover {
      border-color: var(--border-active);
      background: rgba(139,92,246,0.06);
    }

    .quiz-option.correct {
      border-color: var(--success);
      background: rgba(34,197,94,0.08);
    }

    .quiz-option.wrong {
      border-color: var(--danger);
      background: rgba(239,68,68,0.08);
    }

    .quiz-option .radio {
      width: 18px; height: 18px;
      border-radius: 50%;
      border: 2px solid var(--border);
      flex-shrink: 0;
      transition: var(--transition);
    }

    .quiz-option.correct .radio {
      background: var(--success);
      border-color: var(--success);
    }

    .quiz-option.wrong .radio {
      background: var(--danger);
      border-color: var(--danger);
    }

    .quiz-feedback {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      display: none;
    }

    .quiz-feedback.show { display: block; }

    .quiz-feedback.correct-feedback {
      background: rgba(34,197,94,0.1);
      color: var(--success);
      border: 1px solid rgba(34,197,94,0.2);
    }

    .quiz-feedback.wrong-feedback {
      background: rgba(239,68,68,0.1);
      color: var(--danger);
      border: 1px solid rgba(239,68,68,0.2);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 900px) {
      .app-layout {
        grid-template-columns: 1fr;
      }
      .sidebar {
        position: static;
        height: auto;
        border-right: none;
        border-bottom: 1px solid var(--border);
        padding: 1rem 0;
      }
      .lesson-list {
        flex-direction: row;
        overflow-x: auto;
        padding: 0 1rem;
        gap: 4px;
      }
      .lesson-item {
        white-space: nowrap;
        border-left: none;
        border-bottom: 3px solid transparent;
        padding: 8px 14px;
        font-size: 0.8rem;
      }
      .lesson-item.active {
        border-bottom-color: var(--accent);
        border-left-color: transparent;
      }
      .main-content { padding: 1.5rem; }
      .playground-body { grid-template-columns: 1fr; }
      .code-editor-area { border-right: none; border-bottom: 1px solid var(--border); }
      .lesson-title { font-size: 1.5rem; }
    }

    /* ===== ANIMATIONS ===== */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .lesson-view { animation: fadeInUp 0.4s ease; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .completing { animation: pulse 0.5s ease; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="header-inner">
      <div class="logo">
        <div class="logo-icon">&lt;/&gt;</div>
        <span>Learn HTML</span>
      </div>
      <div class="progress-bar-container">
        <span id="progressText">0 / 12 lessons</span>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- APP -->
  <div class="app-layout">

    <!-- SIDEBAR -->
    <nav class="sidebar">
      <div class="sidebar-title">Lessons</div>
      <ul class="lesson-list" id="lessonList"></ul>
    </nav>

    <!-- MAIN -->
    <main class="main-content" id="mainContent">
      <!-- Dynamically populated -->
    </main>

  </div>

<script>
// ============================================================
// LESSON DATA
// ============================================================
const lessons = [
  {
    id: 1,
    title: "Your First HTML Page",
    desc: "Understand the skeleton of every web page — the doctype, html, head, and body tags.",
    tags: [
      { name: "&lt;!DOCTYPE html&gt;", desc: "Tells the browser this is HTML5" },
      { name: "&lt;html&gt;", desc: "Root element of the page" },
      { name: "&lt;head&gt;", desc: "Metadata container (not visible)" },
      { name: "&lt;body&gt;", desc: "All visible content goes here" },
      { name: "&lt;title&gt;", desc: "Sets the browser tab title" }
    ],
    theory: `Every HTML page starts with the same skeleton. <code>&lt;!DOCTYPE html&gt;</code> tells the browser you're using HTML5. The <code>&lt;html&gt;</code> tag wraps everything. Inside it, the <code>&lt;head&gt;</code> holds invisible metadata (like the page title), and the <code>&lt;body&gt;</code> holds everything the user actually sees.`,
    starterCode: `<!DOCTYPE html>
<html>
<head>
  <title>My First Page</title>
</head>
<body>
  <h1>Hello World!</h1>
  <p>This is my very first web page.</p>
</body>
</html>`,
    challenge: `<ol>
<li>Change the <code>&lt;title&gt;</code> to your own name.</li>
<li>Change the <code>&lt;h1&gt;</code> text to a greeting of your choice.</li>
<li>Add a second <code>&lt;p&gt;</code> paragraph below the first one.</li>
</ol>`,
    quiz: {
      question: "Which tag sets the text shown in the browser tab?",
      options: ["&lt;h1&gt;", "&lt;title&gt;", "&lt;head&gt;", "&lt;body&gt;"],
      correct: 1,
      explanation: "The <code>&lt;title&gt;</code> tag inside <code>&lt;head&gt;</code> sets the browser tab text."
    },
    codepen: "https://codepen.io/pen/?template=VwOebbQ"
  },
  {
    id: 2,
    title: "Headings & Paragraphs",
    desc: "Structure your content with six levels of headings and paragraph text.",
    tags: [
      { name: "&lt;h1&gt; – &lt;h6&gt;", desc: "Headings from largest to smallest" },
      { name: "&lt;p&gt;", desc: "A paragraph of text" },
      { name: "&lt;br&gt;", desc: "Line break (self-closing)" },
      { name: "&lt;hr&gt;", desc: "Horizontal rule / divider" }
    ],
    theory: `HTML gives you <strong>six heading levels</strong>: <code>&lt;h1&gt;</code> is the most important (biggest), down to <code>&lt;h6&gt;</code>. Use only <strong>one <code>&lt;h1&gt;</code> per page</strong> — it's like the title of a book. Paragraphs use <code>&lt;p&gt;</code>. Use <code>&lt;br&gt;</code> for a line break inside text, and <code>&lt;hr&gt;</code> to add a horizontal divider.`,
    starterCode: `<!DOCTYPE html>
<html>
<head><title>Headings</title></head>
<body>
  <h1>Main Title</h1>
  <p>This is an intro paragraph.</p>

  <h2>Section One</h2>
  <p>Details about section one.</p>

  <h3>Sub-section</h3>
  <p>More specific info here.</p>

  <hr>

  <h2>Section Two</h2>
  <p>Another topic entirely.</p>
</body>
</html>`,
    challenge: `<ol>
<li>Create a page about your favorite hobby using <code>&lt;h1&gt;</code>, <code>&lt;h2&gt;</code>, and <code>&lt;h3&gt;</code>.</li>
<li>Write at least 3 paragraphs with <code>&lt;p&gt;</code>.</li>
<li>Use an <code>&lt;hr&gt;</code> to separate two major sections.</li>
</ol>`,
    quiz: {
      question: "How many &lt;h1&gt; tags should a page typically have?",
      options: ["As many as you want", "Exactly one", "None", "Two"],
      correct: 1,
      explanation: "Best practice is one <code>&lt;h1&gt;</code> per page for accessibility and SEO."
    },
    codepen: "https://codepen.io/pen/?template=VwOebbQ"
  },
  {
    id: 3,
    title: "Text Formatting",
    desc: "Make text bold, italic, underlined, highlighted, and more.",
    tags: [
      { name: "&lt;strong&gt;", desc: "Important / bold text" },
      { name: "&lt;em&gt;", desc: "Emphasis / italic text" },
      { name: "&lt;u&gt;", desc: "Underlined text" },
      { name: "&lt;mark&gt;", desc: "Highlighted text" },
      { name: "&lt;del&gt;", desc: "Strikethrough / deleted" },
      { name: "&lt;small&gt;", desc: "Smaller text" },
      { name: "&lt;sub&gt; / &lt;sup&gt;", desc: "Subscript / superscript" }
    ],

            <th>Project</th>
            <th>Description</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Portfolio Page</td>
            <td>This very page!</td>
            <td><mark>Complete</mark></td>
          </tr>
          <tr>
            <td>Blog</td>
            <td>A personal blog</td>
            <td><em>In Progress</em></td>
          </tr>
        </tbody>
      </table>
    </section>

    <hr>

    <section id="contact">
      <h2>Contact Me</h2>
      <form>
        <label for="c-name">Name:</label><br>
        <input type="text" id="c-name" required><br><br>

        <label for="c-email">Email:</label><br>
        <input type="email" id="c-email" required><br><br>

        <label for="c-msg">Message:</label><br>
        <textarea id="c-msg" rows="4" cols="40"></textarea><br><br>

        <button type="submit">Send Message</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Your Name. Built with <strong>pure HTML</strong>.</p>
    <p><a href="#top">Back to Top</a></p>
  </footer>

</body>
</html>`,
    challenge: `<ol>
<li>Customize this portfolio with your real information.</li>
<li>Add an <code>&lt;audio&gt;</code> or <code>&lt;video&gt;</code> section.</li>
<li>Add a "Favorites" section with a description list (<code>&lt;dl&gt;</code>).</li>
<li>Make sure you use <strong>zero</strong> <code>&lt;div&gt;</code> tags — only semantic HTML!</li>
<li>Open it in a browser and admire your work! 🎉</li>
</ol>`,
    quiz: {
      question: "Which of these is the correct order for a well-structured HTML page?",
      options: [
        "body → head → html → DOCTYPE",
        "DOCTYPE → html → head → body",
        "html → DOCTYPE → body → head",
        "head → body → html → DOCTYPE"
      ],
      correct: 1,
      explanation: "The correct order is: <code>&lt;!DOCTYPE html&gt;</code> → <code>&lt;html&gt;</code> → <code>&lt;head&gt;</code> → <code>&lt;body&gt;</code>."
    },
    codepen: "https://codepen.io/pen/?template=VwOebbQ"
  }
];

// ============================================================
// STATE
// ============================================================
let currentLesson = 0;
let completedLessons = new Set();

// Load progress from localStorage
try {
  const saved = localStorage.getItem('html-course-progress');
  if (saved) {
    const parsed = JSON.parse(saved);
    completedLessons = new Set(parsed.completed || []);
    currentLesson = parsed.current || 0;
  }
} catch(e) {}

function saveProgress() {
  try {
    localStorage.setItem('html-course-progress', JSON.stringify({
      completed: [...completedLessons],
      current: currentLesson
    }));
  } catch(e) {}
}

// ============================================================
// RENDER SIDEBAR
// ============================================================
function renderSidebar() {
  const list = document.getElementById('lessonList');
  list.innerHTML = lessons.map((lesson, i) => {
    const isActive = i === currentLesson;
    const isCompleted = completedLessons.has(i);
    return `
      <li class="lesson-item ${isActive ? 'active' : ''} ${isCompleted ? 'completed' : ''}"
          onclick="goToLesson(${i})" id="sidebar-lesson-${i}">
        <span class="lesson-num">${isCompleted ? '✓' : lesson.id}</span>
        <span>${lesson.title}</span>
      </li>
    `;
  }).join('');
}

// ============================================================
// RENDER LESSON
// ============================================================
function renderLesson() {
  const lesson = lessons[currentLesson];
  const main = document.getElementById('mainContent');

  main.innerHTML = `
    <div class="lesson-view">
      <div class="lesson-header">
        <div class="lesson-badge">📘 Lesson ${lesson.id} of ${lessons.length}</div>
        <h1 class="lesson-title">${lesson.title}</h1>
        <p class="lesson-desc">${lesson.desc}</p>
      </div>

      <!-- THEORY -->
      <div class="content-section">
        <h2 class="section-title"><span class="icon">📖</span> Concept</h2>
        <p class="theory-text">${lesson.theory}</p>

        <div class="tip-box">
          <strong>💡 Tags in this lesson:</strong>
        </div>
        <div class="tag-grid">
          ${lesson.tags.map(t => `
            <div class="tag-card">
              <div class="tag-card-name">${t.name}</div>
              <div class="tag-card-desc">${t.desc}</div>
            </div>
          `).join('')}
        </div>
      </div>

      <!-- LIVE PLAYGROUND -->
      <div class="content-section">
        <h2 class="section-title"><span class="icon">⚡</span> Live Playground</h2>
        <p class="theory-text">Edit the code on the left and see the result instantly on the right.</p>
        <div class="code-playground">
          <div class="playground-tabs">
            <div class="playground-tab active">HTML</div>
            <div class="playground-tab" style="margin-left:auto; color: var(--text-muted); cursor: default; font-size: 0.7rem;">LIVE PREVIEW →</div>
          </div>
          <div class="playground-body">
            <div class="code-editor-area">
              <textarea id="codeEditor"
                spellcheck="false"
                placeholder="Type your HTML here...">${escapeHtml(lesson.starterCode)}</textarea>
            </div>
            <div class="preview-pane">
              <div class="preview-label">Preview</div>
              <iframe id="previewFrame"></iframe>
            </div>
          </div>
        </div>
        <div style="margin-top: 12px; display: flex; gap: 10px; flex-wrap: wrap;">
          <button class="btn btn-secondary" onclick="resetCode()">↺ Reset Code</button>
          <a class="btn btn-codepen" href="${lesson.codepen}" target="_blank" rel="noopener">
            ✏️ Practice on CodePen
          </a>
        </div>
      </div>

      <!-- CHALLENGE -->
      <div class="content-section">
        <div class="challenge-box">
          <div class="challenge-title">🏆 Challenge</div>
          <div class="challenge-text">${lesson.challenge}</div>
          <p class="theory-text" style="font-size: 0.82rem; margin-top: 0.5rem; color: var(--text-muted);">Try completing the challenge in the playground above, or open it in CodePen!</p>
        </div>
      </div>

      <!-- QUIZ -->
      <div class="content-section">
        <h2 class="section-title"><span class="icon">🧠</span> Quick Quiz</h2>
        <div class="quiz-container">
          <div class="quiz-question">${lesson.quiz.question}</div>
          <div class="quiz-options" id="quizOptions">
            ${lesson.quiz.options.map((opt, i) => `
              <div class="quiz-option" onclick="answerQuiz(${i}, ${lesson.quiz.correct})" id="quiz-opt-${i}">
                <span class="radio"></span>
                <span>${opt}</span>
              </div>
            `).join('')}
          </div>
          <div class="quiz-feedback" id="quizFeedback"></div>
        </div>
      </div>

      <!-- NAV -->
      <div class="lesson-nav">
        ${currentLesson > 0
          ? `<button class="btn btn-secondary" onclick="goToLesson(${currentLesson - 1})">← Previous</button>`
          : `<div></div>`
        }
        <button class="btn btn-success" onclick="markComplete()" id="completeBtn">
          ${completedLessons.has(currentLesson) ? '✓ Completed' : '✓ Mark Complete'}
        </button>
        ${currentLesson < lessons.length - 1
          ? `<button class="btn btn-primary" onclick="goToLesson(${currentLesson + 1})">Next →</button>`
          : `<div></div>`
        }
      </div>
    </div>
  `;

  // Wire up live preview
  const editor = document.getElementById('codeEditor');
  const frame = document.getElementById('previewFrame');

  function updatePreview() {
    frame.srcdoc = editor.value;
  }

  editor.addEventListener('input', updatePreview);
  updatePreview();

  // Handle tab key in editor
  editor.addEventListener('keydown', function(e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      const start = this.selectionStart;
      const end = this.selectionEnd;
      this.value = this.value.substring(0, start) + '  ' + this.value.substring(end);
      this.selectionStart = this.selectionEnd = start + 2;
      updatePreview();
    }
  });

  // Scroll to top
  main.scrollTop = 0;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ============================================================
// ACTIONS
// ============================================================
function goToLesson(index) {
  currentLesson = index;
  saveProgress();
  renderSidebar();
  renderLesson();
  updateProgress();
}

function markComplete() {
  completedLessons.add(currentLesson);
  saveProgress();
  renderSidebar();
  updateProgress();
  const btn = document.getElementById('completeBtn');
  if (btn) {
    btn.textContent = '✓ Completed';
    btn.classList.add('completing');
  }
}

function resetCode() {
  const editor = document.getElementById('codeEditor');
  const frame = document.getElementById('previewFrame');
  editor.value = lessons[currentLesson].starterCode;
  frame.srcdoc = editor.value;
}

function answerQuiz(selected, correct) {
  const options = document.querySelectorAll('.quiz-option');
  const feedback = document.getElementById('quizFeedback');

  // Reset
  options.forEach(o => { o.classList.remove('correct', 'wrong'); o.style.pointerEvents = 'none'; });

  if (selected === correct) {
    options[selected].classList.add('correct');
    feedback.className = 'quiz-feedback show correct-feedback';
    feedback.innerHTML = '✅ Correct! ' + lessons[currentLesson].quiz.explanation;
  } else {
    options[selected].classList.add('wrong');
    options[correct].classList.add('correct');
    feedback.className = 'quiz-feedback show wrong-feedback';
    feedback.innerHTML = '❌ Not quite. ' + lessons[currentLesson].quiz.explanation;
  }
}

function updateProgress() {
  const total = lessons.length;
  const done = completedLessons.size;
  const pct = Math.round((done / total) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${done} / ${total} lessons`;
}

function escapeHtml(str) {
  // We need to NOT escape for textarea value
  return str;
}

// ============================================================
// INIT
// ============================================================
renderSidebar();
renderLesson();
updateProgress();
</script>

</body>
</html>
